name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    env:
      # Secrets aren't readable in a step-level `if`, so surface presence here.
      HAS_APP_KEY: ${{ secrets.DERANGEDIONS_CI_APP_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Authenticate to private DerangedIons deps
        if: env.HAS_APP_KEY == 'true'
        uses: DerangedIons/.github/actions/julia-private-deps@main
        with:
          app-private-key: ${{ secrets.DERANGEDIONS_CI_APP_KEY }}
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  docs-render:
    name: Docs render smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Secrets aren't readable in a step-level `if`, so surface presence here.
      HAS_APP_KEY: ${{ secrets.DERANGEDIONS_CI_APP_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Authenticate to private DerangedIons deps
        if: env.HAS_APP_KEY == 'true'
        uses: DerangedIons/.github/actions/julia-private-deps@main
        with:
          app-private-key: ${{ secrets.DERANGEDIONS_CI_APP_KEY }}
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install lcov
        run: sudo apt-get install -y lcov
      - name: Install docs dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Render template's own docs
        run: quarto render docs
